{# ============================================================
   Alerts bell — جرس الأليرتس المشترك
   بيتعامل مع main.js → AlertsCenter (الكائن Alerts)
   استخدام: {% include '_alerts_bell.html' %}
   ============================================================ #}
<div id="alertsWrap" class="relative">
  <button id="btnAlerts" type="button" title="Alerts"
    class="relative flex items-center justify-center w-11 h-11 rounded-full border border-gray-200 dark:border-slate-700 bg-white dark:bg-[#0e1628] hover:bg-slate-50 dark:hover:bg-slate-800 shadow-sm transition">
    <svg class="w-6 h-6 text-slate-600 dark:text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 0 0-4.5-5.8V5a1.5 1.5 0 0 0-3 0v.2A6 6 0 0 0 6 11v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v.5a3 3 0 0 1-6 0V17m6 0H9"/>
    </svg>
    <span id="alertsBadge"
      class="hidden absolute -top-1 -right-1 min-w-[20px] h-5 px-1 rounded-full bg-red-600 text-white text-[11px] font-bold items-center justify-center ring-2 ring-white dark:ring-[#0e1628]">0</span>
  </button>

  <div id="alertsMenu"
    class="hidden absolute right-0 mt-2 w-[26rem] max-w-[92vw] z-[120] rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-[#0e1628] shadow-2xl overflow-hidden text-left">

    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60">
      <span class="font-bold text-slate-700 dark:text-slate-200">
        Alerts <span id="alertsCount" class="text-xs font-semibold text-slate-500 dark:text-slate-400">(0)</span>
      </span>
      <button id="btnAlertsReset" type="button"
        class="text-xs font-bold px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white transition">
        RESET
      </button>
    </div>

    <ul id="alertsList" class="max-h-[22rem] overflow-y-auto divide-y divide-gray-100 dark:divide-slate-800"></ul>

    <div id="alertsEmpty" class="px-4 py-8 text-center text-sm text-slate-400">
      No active alerts
    </div>
  </div>
</div>
