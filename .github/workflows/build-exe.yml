name: Build Windows EXE

# بيشتغل إمتى:
#   - يدوي من تبويب Actions (زرار Run workflow)
#   - أوتوماتيك لما تعمل tag زي v1.0.0  → بيعمل Release وبيرفع الملف
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # لازم ويندوز: pythonnet و pyodbc و VisionMaster كلهم ويندوز
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      # كاش لـ Nuitka — بيقلّل وقت البناء من ~30 دقيقة لـ ~5 دقايق
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Build with Nuitka
        run: .\build_nuitka.bat

      # ملحوظة: VisionMaster نفسه مش متسطب على الـ runner، وده عادي.
      # vision_master.py بيعمل import لـ clr وقت التشغيل مش وقت البناء،
      # فالكومبايل بينجح عادي. أول اختبار حقيقي بيكون على جهاز فيه
      # VisionMaster متسطب.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: beko-vision-windows
          path: dist/main_fastapi.dist/
          retention-days: 30

      # مع أي tag بيعمل Release فيه zip جاهز للعميل
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path dist/main_fastapi.dist/* -DestinationPath beko-vision-${{ github.ref_name }}.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: beko-vision-${{ github.ref_name }}.zip
          body: |
            ## Beko Vision System ${{ github.ref_name }}

            ### التسطيب على جهاز العميل
            1. فك ضغط الملف في مكان ثابت، مثلاً `C:\beko\`
            2. سطّب ODBC Driver 18 for SQL Server (x64) — مرة واحدة بس
            3. اتأكد إن VisionMaster متسطب ومرخّص
            4. انسخ `config.json` و `logins.csv` و `CreateProgram\` من النسخة القديمة
            5. شغّل `main_fastapi.exe`
